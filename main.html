<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Secure Account Setup</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 20px;
		}

		.container {
			width: 100%;
			max-width: 500px;
		}

		.header {
			text-align: center;
			margin-bottom: 40px;
			color: white;
		}

		.header h1 {
			font-size: 32px;
			font-weight: 700;
			margin-bottom: 8px;
			letter-spacing: -0.5px;
		}

		.header p {
			font-size: 14px;
			opacity: 0.9;
			font-weight: 500;
		}

		.card {
			background: white;
			border-radius: 12px;
			padding: 40px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
		}

		.form-section {
			margin-bottom: 28px;
		}

		.form-section:last-of-type {
			margin-bottom: 0;
		}

		.section-title {
			font-size: 12px;
			font-weight: 700;
			text-transform: uppercase;
			color: #667eea;
			letter-spacing: 1px;
			margin-bottom: 16px;
			display: block;
		}

		.form-group {
			margin-bottom: 16px;
		}

		.form-group:last-child {
			margin-bottom: 0;
		}

		label {
			display: block;
			font-size: 13px;
			font-weight: 600;
			color: #333;
			margin-bottom: 8px;
		}

		input {
			width: 100%;
			padding: 12px 14px;
			border: 1.5px solid #e0e0e0;
			border-radius: 8px;
			font-size: 15px;
			font-family: inherit;
			transition: all 0.3s ease;
			background: #f9f9f9;
		}

		input:hover {
			border-color: #d0d0d0;
			background: white;
		}

		input:focus {
			outline: none;
			border-color: #667eea;
			background: white;
			box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
		}

		.card-fields {
			display: grid;
			grid-template-columns: 2fr 1fr;
			gap: 12px;
		}

		.card-fields .form-group:last-child {
			grid-column: 1;
		}

		button {
			width: 100%;
			padding: 14px;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
			border: none;
			border-radius: 8px;
			font-size: 15px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s ease;
			margin-top: 12px;
			letter-spacing: 0.5px;
		}

		button:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
		}

		button:active {
			transform: translateY(0);
		}

		.output {
			margin-top: 24px;
			padding: 14px 16px;
			border-radius: 8px;
			font-size: 14px;
			font-weight: 500;
			display: none;
			animation: slideIn 0.3s ease;
		}

		.output.success {
			background: #e8f5e9;
			color: #2e7d32;
			border: 1px solid #4caf50;
			display: block;
		}

		.output.error {
			background: #ffebee;
			color: #c62828;
			border: 1px solid #f44336;
			display: block;
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateY(-10px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@media (max-width: 480px) {
			.card {
				padding: 28px 20px;
			}

			.header h1 {
				font-size: 26px;
			}

			.card-fields {
				grid-template-columns: 1fr;
			}

			.card-fields .form-group:last-child {
				grid-column: auto;
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="header">
			<h1>Account Setup</h1>
			<p>Complete your profile securely</p>
		</div>

		<div class="card">
			<form id="form">
				<div class="form-section">
					<span class="section-title">Personal Information</span>
					<div class="form-group">

					<label for="nameInput">Full Legal Name</label>

						<input id="nameInput" type="text" placeholder="John Doe">
					</div>
					<div class="form-group">
						<label for="ageInput">Age</label>
						<input id="ageInput" type="number" placeholder="25" min="1" max="120">
					</div>
				</div>

				<div class="form-section">
					<span class="section-title">Payment Method</span>
					<div class="form-group">
						<label for="cardNumber">Credit Card Number</label>
						<input id="cardNumber" type="text" placeholder="4111 1111 1111 1111" maxlength="19">
					</div>
					<div class="card-fields">
						<div class="form-group">
							<label for="cardExpiry">Expires</label>
							<input id="cardExpiry" type="text" placeholder="12/25" maxlength="5">
						</div>
						<div class="form-group">
							<label for="cardCVV">CVV</label>
							<input id="cardCVV" type="text" placeholder="123" maxlength="4">
						</div>
					</div>
				</div>

				<button type="button" id="saveBtn">Complete Setup</button>
				<div id="output" class="output"></div>
			</form>
		</div>
	</div>

	<script>
		const nameInput = document.getElementById('nameInput');
		const ageInput = document.getElementById('ageInput');
		const cardNumber = document.getElementById('cardNumber');
		const cardExpiry = document.getElementById('cardExpiry');
		const cardCVV = document.getElementById('cardCVV');
		const btn = document.getElementById('saveBtn');
		const out = document.getElementById('output');

		function showMessage(text, isSuccess) {
			out.textContent = text;
			out.className = `output ${isSuccess ? 'success' : 'error'}`;
		}

		function validateCardNumber(num) {
			const digits = num.replace(/\s/g, '');
			return /^\d{16}$/.test(digits);
		}

		function validateExpiry(expiry) {
			if (!/^\d{2}\/\d{2}$/.test(expiry)) return false;
			const [month, year] = expiry.split('/');
			const m = parseInt(month);
			return m >= 1 && m <= 12;
		}

		function validateCVV(cvv) {
			return /^\d{3,4}$/.test(cvv);
		}

		btn.addEventListener('click', () => {
			const name = nameInput.value.trim();
			const age = ageInput.value.trim();
			const card = cardNumber.value.trim();
			const expiry = cardExpiry.value.trim();
			const cvv = cardCVV.value.trim();

			if (!name || !age) {
				showMessage('Please enter your name and age.', false);
				return;
			}
			if (!card) {
				showMessage('Please enter your card number.', false);
				return;
			}
			if (!validateCardNumber(card)) {
				showMessage('Invalid card number. Must be 16 digits.', false);
				return;
			}
			if (!expiry) {
				showMessage('Please enter the expiration date.', false);
				return;
			}
			if (!validateExpiry(expiry)) {
				showMessage('Invalid expiration date. Use MM/YY format.', false);
				return;
			}
			if (!cvv) {
				showMessage('Please enter the CVV.', false);
				return;
			}
			if (!validateCVV(cvv)) {
				showMessage('Invalid CVV. Must be 3 or 4 digits.', false);
				return;
			}
			showMessage(`✓ Setup complete! Welcome, ${name}.`, true);
		});

		cardNumber.addEventListener('input', (e) => {
			let value = e.target.value.replace(/\s/g, '');
			let formatted = value.match(/.{1,4}/g)?.join(' ') || value;
			e.target.value = formatted;
		});
	</script>
</body>
</html>
