<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Enter Name</title>
</head>
<body>
	<label for="nameInput">Your name:</label>
	<input id="nameInput" type="text" placeholder="Enter your name">

	<label for="ageInput">Your age:</label>
	<input id="ageInput" type="number" placeholder="Enter your age">

	<label for="cardNumber">Credit Card Number:</label>
	<input id="cardNumber" type="text" placeholder="1234 5678 9012 3456" maxlength="19">

	<label for="cardExpiry">Expiration (MM/YY):</label>
	<input id="cardExpiry" type="text" placeholder="12/25" maxlength="5">

	<label for="cardCVV">CVV:</label>
	<input id="cardCVV" type="text" placeholder="123" maxlength="4">

	<button id="saveBtn">Save</button>

	<p id="output"></p>

	<script>
		const nameInput = document.getElementById('nameInput');
		const ageInput = document.getElementById('ageInput');
		const cardNumber = document.getElementById('cardNumber');
		const cardExpiry = document.getElementById('cardExpiry');
		const cardCVV = document.getElementById('cardCVV');
		const btn = document.getElementById('saveBtn');
		const out = document.getElementById('output');

		function validateCardNumber(num) {
			const digits = num.replace(/\s/g, '');
			return /^\d{16}$/.test(digits);
		}

		function validateExpiry(expiry) {
			if (!/^\d{2}\/\d{2}$/.test(expiry)) return false;
			const [month, year] = expiry.split('/');
			const m = parseInt(month);
			return m >= 1 && m <= 12;
		}

		function validateCVV(cvv) {
			return /^\d{3,4}$/.test(cvv);
		}

		btn.addEventListener('click', () => {
			const name = nameInput.value.trim();
			const age = ageInput.value.trim();
			const card = cardNumber.value.trim();
			const expiry = cardExpiry.value.trim();
			const cvv = cardCVV.value.trim();

			if (!name || !age) {
				out.textContent = 'Please enter name and age.';
				return;
			}
			if (!card) {
				out.textContent = 'Please enter credit card number.';
				return;
			}
			if (!validateCardNumber(card)) {
				out.textContent = 'Invalid card number. Must be 16 digits.';
				return;
			}
			if (!expiry) {
				out.textContent = 'Please enter expiration date.';
				return;
			}
			if (!validateExpiry(expiry)) {
				out.textContent = 'Invalid expiration. Use MM/YY format with month 01-12.';
				return;
			}
			if (!cvv) {
				out.textContent = 'Please enter CVV.';
				return;
			}
			if (!validateCVV(cvv)) {
				out.textContent = 'Invalid CVV. Must be 3 or 4 digits.';
				return;
			}
			out.textContent = `✓ Saved: ${name}, Age: ${age}, Card: ****${card.slice(-4)}`;
		});
	</script>
</body>
</html>
